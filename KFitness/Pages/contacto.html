<!DOCTYPE html>
<html lang='es'>
<head>
  <meta charset='UTF-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1.0'>
  <title>KFitness - Contacto</title>
  <link rel='stylesheet' href='../Assets/css/estilos.css?v=2'>
  <link rel='stylesheet' href='../Assets/css/responsive.css'>
</head>
<body>
  <header class='site-header' aria-label='Encabezado del sitio'></header>
  <main>
    <section class='encabezado-interno encabezado-kfitness4' aria-labelledby='contacto-titulo'>
      <div class='contenedor encabezado-interno-contenido'>
        <h1 id='contacto-titulo'>Contacto KFitness</h1>
        <p>Comunícate directamente con KFitness para resolver tus dudas sobre entrenamientos, servicios, horarios y reservas.</p>
      </div>
    </section>
    <section class='seccion contacto-principal' aria-label='Información y formulario de contacto'>
      <div class='contenedor contacto-contenido'>
        <div>
          <div class='datos-contacto'>
            <div>
              <h3>Propietaria</h3>
              <p>Iveth Karina Martinez Garcia</p>
            </div>
            <div>
              <h3>Empresa</h3>
              <p>KFitness</p>
            </div>
            <div>
              <h3>Teléfono</h3>
              <p><a href='tel:+50670124477'>+506 7012 4477</a></p>
            </div>
            <div>
              <h3>Correo</h3>
              <p><a href='mailto:karinamartinezg19@gmail.com'>karinamartinezg19@gmail.com</a></p>
            </div>
          </div>
        </div>
        <form id='form-contacto' class='formulario' novalidate>
          <h2>Escríbenos</h2>
          <label for='contacto-nombre'>Nombre</label>
          <input type='text' id='contacto-nombre' name='nombre' required>
          <label for='contacto-email'>Correo electrónico</label>
          <input type='email' id='contacto-email' name='email' required>
          <label for='contacto-telefono'>Teléfono</label>
          <input type='tel' id='contacto-telefono' name='telefono' required>
          <label for='contacto-asunto'>Asunto</label>
          <input type='text' id='contacto-asunto' name='asunto' required>
          <label for='contacto-mensaje'>Mensaje</label>
          <textarea id='contacto-mensaje' name='mensaje' rows='5' required></textarea>
          <button type='submit' class='boton boton-principal'>Enviar</button>
          <p class='mensaje-formulario' id='contacto-mensaje-respuesta' aria-live='polite'></p>
        </form>
      </div>
    </section>
  </main>
  <footer class='site-footer' aria-label='Pie de página'></footer>
  <script src='../Assets/js/app.js?v=20261003-1' defer></script>
  <script src='../Assets/js/formularios.js?v=2' defer></script>
</body>
</html>
